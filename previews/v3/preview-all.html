<style>body{margin:0}.pv{position:relative;z-index:100;background:#111;color:#eee;font:13px/1.4 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px}

<link href=&quot;https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=Work+Sans:wght@300;400;500;600&amp;display=swap&quot; rel=&quot;stylesheet&quot;><style>#mcc-app{--green-900:#0F2822; --green-800:#16352E; --green-700:#204A40; --brass:#B8892F; --brass-light:#D7AE5C; --plaster:#F3EEE2; --plaster-dim:#EAE2CF; --maroon:#5C2A2A; --sage:#7C9A87; --ink:#1B211E; --bg:var(--plaster); --surface:#FFFDF8; --text:var(--ink); --text-dim:#5B6560; --line:#DCD3BC; --arch:var(--green-800);}
#mcc-app *{box-sizing:border-box; margin:0; padding:0;}
#mcc-app{background:var(--bg); color:var(--text); font-family:'Work Sans', sans-serif; font-weight:400; line-height:1.6; overflow-x:hidden;}
#mcc-app img{max-width:100%; display:block;}
#mcc-app a{color:inherit; text-decoration:none;}
#mcc-app .mcc-wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
#mcc-app h1, #mcc-app h2, #mcc-app h3{font-family:'Amiri', serif; font-weight:700; line-height:1.15; letter-spacing:0.2px;}
#mcc-app header{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
#mcc-app .mcc-nav{display:flex; align-items:center; padding:20px 28px; max-width:1180px; margin:0 auto;}
#mcc-app .mcc-logo{display:flex; align-items:center; gap:12px; font-family:'Amiri', serif; font-weight:700; font-size:19px; color:var(--text); white-space:nowrap;}
#mcc-app .mcc-logo-mark{width:34px; height:34px; flex-shrink:0; background:var(--green-800); border-radius:9px; display:flex; align-items:center; justify-content:center;}
#mcc-app .mcc-logo-mark svg{width:20px; height:20px;}
#mcc-app .mcc-navlinks{display:flex; gap:34px; font-size:15px; color:var(--text-dim); margin-left:auto; margin-right:48px;}
#mcc-app .mcc-navlinks a:hover{color:var(--brass);}
#mcc-app .mcc-navtools{display:flex; align-items:center; gap:20px;}
#mcc-app .mcc-cart-btn{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text); border:1px solid var(--line); padding:9px 18px; border-radius:999px;}
@media (max-width:840px){#mcc-app .mcc-navlinks{display:none;}}
#mcc-app .mcc-hero{position:relative; padding:40px 0 0; overflow:hidden;}
#mcc-app .mcc-hero-skyline{position:absolute; left:0; right:0; bottom:0; height:82px; opacity:0.5; pointer-events:none;}
#mcc-app .mcc-hero-skyline svg{width:100%; height:100%; display:block;}
#mcc-app .mcc-hero-inner{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 28px 110px; display:grid; grid-template-columns:1.15fr 0.85fr; align-items:center; gap:40px;}
#mcc-app .mcc-trust-badge{display:inline-flex; align-items:center; gap:9px; font-size:13px; color:var(--text-dim); border:1px solid var(--line); border-radius:999px; padding:7px 16px 7px 12px; margin-bottom:22px; background:var(--surface);}
#mcc-app .mcc-trust-badge .mcc-dot{width:7px; height:7px; border-radius:50%; background:var(--brass); box-shadow:0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent);}
#mcc-app .mcc-hero-copy .mcc-kicker{color:var(--brass); font-size:15px; font-style:italic; font-family:'Amiri', serif; margin-bottom:18px;}
#mcc-app .mcc-hero-copy h1{font-size:clamp(34px, 4.2vw, 54px); max-width:12ch; color:var(--text);}
#mcc-app .mcc-hero-copy p{margin-top:18px; max-width:42ch; color:var(--text-dim); font-size:17px;}
#mcc-app .mcc-hero-actions{display:flex; gap:16px; margin-top:26px; align-items:center; flex-wrap:wrap;}
#mcc-app .mcc-btn-primary{background:var(--brass); color:var(--green-900); padding:15px 30px; font-size:15px; font-weight:600; border-radius:999px; transition:transform .18s ease, background .18s ease, box-shadow .18s ease; box-shadow:0 6px 20px -8px rgba(184,137,47,0.55);}
#mcc-app .mcc-btn-primary:hover{background:var(--brass-light); transform:translateY(-1px); box-shadow:0 10px 26px -8px rgba(184,137,47,0.65);}
#mcc-app .mcc-btn-ghost{color:var(--text); font-size:15px; border-bottom:1px solid var(--brass); padding-bottom:3px;}
#mcc-app .mcc-hero-mini-stats{display:flex; gap:32px; margin-top:28px; padding-top:18px; border-top:1px solid var(--line); max-width:440px;}

#mcc-app .mcc-hero-mini-stats strong{font-family:'Amiri', serif; font-size:22px; color:var(--text);}
#mcc-app .mcc-hero-mini-stats span{font-size:12.5px; color:var(--text-dim);}
#mcc-app .mcc-hero-card{position:relative; max-width:280px; margin:0 auto; transform:rotate(var(--r, 0deg)); filter:drop-shadow(0 30px 50px -20px rgba(15,40,34,0.5));}
#mcc-app .mcc-hero-card svg{width:100%; height:auto; display:block; border-radius:20px;}
#mcc-app .mcc-hero-card-tag{position:absolute; left:50%; bottom:-18px; transform:translateX(-50%) rotate(calc(var(--r,0deg) * -1)); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 18px; font-size:12.5px; color:var(--text); white-space:nowrap; display:flex; align-items:center; gap:8px; box-shadow:0 10px 24px -10px rgba(15,40,34,0.3);}
#mcc-app .mcc-hero-card-tag .mcc-ar{font-size:12px; color:var(--text-dim);}
@media (max-width:900px){#mcc-app .mcc-hero-inner{grid-template-columns:1fr; padding-bottom:88px;}
#mcc-app .mcc-hero-card{margin-top:20px;}
#mcc-app .mcc-hero-skyline{height:60px;}}
#mcc-app .mcc-strip{margin-top:0; background:var(--plaster-dim); border-radius:16px; max-width:1180px; margin-left:auto; margin-right:auto; transform:translateY(-70px);}
#mcc-app .mcc-strip .mcc-wrap{display:flex; flex-wrap:wrap; gap:0; padding:22px 28px; max-width:none;}
#mcc-app .mcc-strip-item{flex:1 1 220px; padding:10px 24px; border-right:1px solid var(--line); font-size:13.5px; color:var(--text-dim);}
#mcc-app .mcc-strip-item:last-child{border-right:none;}
#mcc-app .mcc-strip-item strong{display:block; color:var(--text); font-size:14px; margin-bottom:2px;}
#mcc-app .mcc-section{padding:96px 28px;}
#mcc-app .mcc-section-head{max-width:600px; margin-bottom:52px;}
#mcc-app .mcc-section-head h2{font-size:clamp(28px,3.2vw,38px); color:var(--text);}
#mcc-app .mcc-section-head p{margin-top:14px; color:var(--text-dim); font-size:16px; max-width:48ch;}
#mcc-app .mcc-grid-by-size{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
#mcc-app .mcc-size-card{background:var(--surface); padding:38px 30px; display:flex; flex-direction:column; gap:16px; border:1px solid var(--line); border-radius:18px; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
#mcc-app .mcc-size-card:hover{transform:translateY(-4px); box-shadow:0 20px 40px -24px rgba(15,40,34,0.35); border-color:var(--brass);}
#mcc-app .mcc-size-head{display:flex; flex-direction:column; gap:5px;}
#mcc-app .mcc-size-card .mcc-dims{font-family:'Amiri', serif; font-size:30px; color:var(--brass); line-height:1.2;}
#mcc-app .mcc-size-card .mcc-dims span{font-size:15px; color:var(--text-dim); font-family:'Work Sans',sans-serif;}
#mcc-app .mcc-size-card h3{font-size:19px; color:var(--text); font-weight:700;}
#mcc-app .mcc-size-card p{font-size:14.5px; color:var(--text-dim); flex:1; line-height:1.55;}
#mcc-app .mcc-size-foot{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:14px;}
#mcc-app .mcc-size-card .mcc-rows{font-size:13px; color:var(--sage);}
#mcc-app .mcc-size-card .mcc-price{font-size:15px; color:var(--text); font-weight:600;}
@media (max-width:900px){#mcc-app .mcc-grid-by-size{grid-template-columns:1fr;}}
#mcc-app .mcc-saff-section{background: radial-gradient(circle at 88% 12%, color-mix(in srgb, var(--brass) 16%, transparent), transparent 55%), var(--green-800); color:var(--plaster); padding:96px 28px;}
#mcc-app .mcc-saff-section .mcc-wrap{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px; align-items:center;}
#mcc-app .mcc-saff-section h2{color:var(--plaster); font-size:clamp(26px,3vw,34px);}
#mcc-app .mcc-saff-kicker{color:var(--brass-light); font-size:15px; font-style:italic; margin-bottom:12px; display:block;}
#mcc-app .mcc-saff-section p{color:#C9D2CB; margin-top:16px; font-size:16px; max-width:44ch;}
#mcc-app .mcc-saff-facts{list-style:none; margin-top:26px; display:flex; flex-direction:column; gap:12px;}
#mcc-app .mcc-saff-fact{display:flex; gap:16px; align-items:flex-start; background:rgba(243,238,226,0.05); border:1px solid rgba(243,238,226,0.12); border-radius:14px; padding:16px 18px; transition:background .2s ease, border-color .2s ease;}
#mcc-app .mcc-saff-fact:hover{background:rgba(243,238,226,0.09); border-color:rgba(184,137,47,0.4);}
#mcc-app .mcc-saff-fact-rec{border-color:rgba(184,137,47,0.5); background:rgba(184,137,47,0.09);}
#mcc-app .mcc-saff-fact-num{flex-shrink:0; width:40px; height:40px; border-radius:50%; background:var(--brass); color:var(--green-900); font-family:'Amiri',serif; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;}
#mcc-app .mcc-saff-fact-rec .mcc-saff-fact-num{background:var(--brass-light);}
#mcc-app .mcc-saff-fact-body{display:flex; flex-direction:column; gap:4px;}

#mcc-app .mcc-saff-fact-tag{font-family:'Work Sans',sans-serif; font-style:normal; font-size:10.5px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:var(--green-900); background:var(--brass-light); padding:2px 8px; border-radius:999px;}
#mcc-app .mcc-saff-fact-body span{font-size:14px; color:#C9D2CB; line-height:1.5;}
#mcc-app .mcc-saff-diagram-wrap{position:relative; border-radius:20px; overflow:hidden; border:1px solid rgba(184,137,47,0.25); box-shadow:0 30px 60px -30px rgba(0,0,0,0.5);}

#mcc-app .mcc-saff-diagram-tag{position:absolute; top:16px; right:16px; background:var(--surface); color:var(--green-900); font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; box-shadow:0 8px 20px -8px rgba(0,0,0,0.35);}
@media (max-width:900px){#mcc-app .mcc-saff-section .mcc-wrap{grid-template-columns:1fr;}}
#mcc-app .mcc-colorways{display:grid; grid-template-columns:repeat(5,1fr); gap:18px;}

#mcc-app .mcc-swatch[aria-pressed=&quot;true&quot;] .mcc-block{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--brass);}
#mcc-app .mcc-swatch-pulse .mcc-block{animation:mcc-swatch-pop .45s ease;}
@keyframes mcc-swatch-pop{
    0%{transform:scale(1);}
    45%{transform:scale(1.06);}
    100%{transform:scale(1);}
  }
#mcc-app .mcc-swatch .mcc-block{aspect-ratio:1; border-radius:14px; background-size:cover; background-position:center; border:1px solid var(--line); position:relative; overflow:hidden; transition:transform .2s ease;}
#mcc-app .mcc-swatch:hover .mcc-block{transform:translateY(-3px) scale(1.02);}
#mcc-app .mcc-swatch .mcc-block::after{content:''; position:absolute; inset:0; background: repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 34px);}
#mcc-app .mcc-swatch p{font-size:13.5px; color:var(--text); font-weight:500;}
#mcc-app .mcc-swatch span{font-size:12px; color:var(--text-dim);}
#mcc-app .mcc-colorway-preview{margin-top:22px; text-align:center; font-size:14px; color:var(--text-dim); opacity:0; transition:opacity .25s ease; min-height:20px;}
#mcc-app .mcc-colorway-preview.is-visible{opacity:1;}
#mcc-app .mcc-colorway-preview strong{color:var(--text); font-weight:600;}
@media (max-width:900px){#mcc-app .mcc-colorways{grid-template-columns:repeat(2,1fr);}}
#mcc-app .mcc-calc{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:48px; display:grid; grid-template-columns:1fr 1fr; gap:44px;}
#mcc-app .mcc-calc-form label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:8px; margin-top:20px;}
#mcc-app .mcc-calc-form label:first-child{margin-top:0;}
#mcc-app .mcc-calc-form input, #mcc-app .mcc-calc-form select{width:100%; padding:12px 14px; font-size:15px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:10px; font-family:'Work Sans',sans-serif;}
#mcc-app .mcc-calc-result{background:var(--plaster-dim); border-left:3px solid var(--brass); border-radius:14px; padding:28px; display:flex; flex-direction:column; justify-content:center;}
#mcc-app .mcc-calc-result .mcc-num{font-family:'Amiri',serif; font-size:44px; color:var(--green-800); line-height:1;}
#mcc-app .mcc-calc-result .mcc-label{font-size:13px; color:var(--text-dim); margin-top:8px;}
#mcc-app .mcc-calc-result .mcc-note{font-size:13px; color:var(--text-dim); margin-top:18px; border-top:1px solid var(--line); padding-top:16px;}
@media (max-width:840px){#mcc-app .mcc-calc{grid-template-columns:1fr;}}
#mcc-app .mcc-testimonial{max-width:760px; margin:0 auto; text-align:center; padding:100px 28px;}
#mcc-app .mcc-testimonial svg{width:34px; margin:0 auto 28px; opacity:0.5;}
#mcc-app .mcc-testimonial p{font-family:'Amiri', serif; font-style:italic; font-size:clamp(20px,2.4vw,27px); color:var(--text); line-height:1.5;}
#mcc-app .mcc-testimonial cite{display:block; margin-top:26px; font-style:normal; font-size:14px; color:var(--text-dim);}
#mcc-app footer{background:var(--green-900); color:#C9D2CB; padding:64px 28px 32px;}
#mcc-app .mcc-foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; padding-bottom:40px; border-bottom:1px solid rgba(243,238,226,0.12);}
#mcc-app .mcc-foot-grid h4{font-size:13px; color:var(--brass-light); margin-bottom:16px; font-weight:600;}
#mcc-app .mcc-foot-grid a, #mcc-app .mcc-foot-grid p{font-size:14px; color:#B7C1BA; display:block; margin-bottom:10px;}
#mcc-app .mcc-foot-logo{font-family:'Amiri',serif; font-size:20px; color:var(--plaster); margin-bottom:14px;}
#mcc-app .mcc-foot-bottom{display:flex; justify-content:space-between; padding-top:24px; font-size:12.5px; color:#7E8B83; flex-wrap:wrap; gap:12px;}
@media (max-width:840px){#mcc-app .mcc-foot-grid{grid-template-columns:1fr 1fr;}}
@media (prefers-reduced-motion: reduce){#mcc-app *{transition:none !important; scroll-behavior:auto !important;}}
#mcc-app .mcc-ar{font-family:'Amiri', serif; direction:rtl; unicode-bidi:isolate; letter-spacing:normal; line-height:1.9;}
#mcc-app .mcc-bismillah-bar{background:var(--green-900); color:var(--brass-light); text-align:center; padding:10px 12px; font-size:16px;}
#mcc-app .mcc-logo-ar{font-family:'Amiri', serif; direction:rtl; font-size:13px; color:var(--text-dim); margin-top:1px; font-weight:400;}
#mcc-app .mcc-logo-stack{display:flex; flex-direction:column; gap:1px;}
#mcc-app .mcc-star8{display:inline-flex;}
#mcc-app .mcc-star8 svg{width:1em; height:1em; vertical-align:-0.12em;}
#mcc-app .mcc-divider-stars{display:flex; align-items:center; justify-content:center; gap:26px; padding:6px 0 0;}
#mcc-app .mcc-divider-stars svg{width:22px; height:22px; opacity:0.55;}
#mcc-app .mcc-dims-ar{font-family:'Amiri', serif; direction:rtl; font-size:14px; color:var(--sage);}
#mcc-app .mcc-swatch .mcc-ar-name{font-family:'Amiri', serif; direction:rtl; font-size:12.5px; color:var(--text-dim);}
/* Site update v2: styles for new sections. Loaded after mosque-design.css. */
#mcc-app .mcc-btn-primary{display:inline-block; border:none; cursor:pointer; font-family:'Work Sans',sans-serif;}
#mcc-app .mcc-btn-sm{padding:10px 20px; font-size:14px;}
#mcc-app .mcc-btn-outline{display:block; text-align:center; border:1px solid var(--green-800); color:var(--green-800); padding:14px 28px; border-radius:999px; font-weight:600; font-size:15px;}

/* header */

@media (max-width:560px){#mcc-app .mcc-nav{padding:14px 16px;} #mcc-app .mcc-logo{font-size:16px;} #mcc-app .mcc-logo-ar{display:none;}}

/* hall cards */

#mcc-app .mcc-pop-tag{position:absolute; top:-12px; right:22px; background:var(--brass); color:var(--green-900); font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; padding:4px 10px; border-radius:999px;}

#mcc-app .mcc-pillar{border-top:2px solid var(--brass); padding-top:14px;}
#mcc-app .mcc-pillar strong{font-family:'Amiri',serif; font-size:18px; display:block;}
#mcc-app .mcc-pillar span{font-size:14px; color:var(--text-dim);}
@media (max-width:900px){#mcc-app .mcc-source{grid-template-columns:1fr;} #mcc-app .mcc-pillars{grid-template-columns:1fr;}}

/* steps */
#mcc-app .mcc-process{background:var(--plaster-dim);}
#mcc-app .mcc-steps{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
#mcc-app .mcc-step{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px 22px;}
#mcc-app .mcc-step-num{font-family:'Amiri',serif; font-size:40px; color:var(--brass); line-height:1;}
#mcc-app .mcc-step h3{font-size:18px; margin:10px 0 6px;}
#mcc-app .mcc-step p{font-size:14px; color:var(--text-dim);}
#mcc-app .mcc-step .mcc-when{display:inline-block; margin-top:12px; font-size:12px; color:var(--green-700); background:color-mix(in srgb,var(--sage) 18%,transparent); padding:3px 10px; border-radius:999px;}
@media (max-width:900px){#mcc-app .mcc-steps{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){#mcc-app .mcc-steps{grid-template-columns:1fr;}}

/* installation teaser */
#mcc-app .mcc-install{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:start;}
#mcc-app .mcc-install-list{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:16px;}
#mcc-app .mcc-install-list li{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;}
#mcc-app .mcc-install-list strong{display:block; font-size:15px; margin-bottom:4px;}
#mcc-app .mcc-install-list span{font-size:13.5px; color:var(--text-dim);}
#mcc-app .mcc-install-card{background:var(--green-900); color:var(--plaster); border-radius:20px; padding:34px;}
#mcc-app .mcc-install-card h3{font-size:24px; color:var(--brass-light);}
#mcc-app .mcc-install-card p{color:#C9D2CB; font-size:14.5px; margin:10px 0 18px;}
#mcc-app .mcc-opt{display:flex; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid rgba(243,238,226,.14); font-size:14.5px;}
#mcc-app .mcc-opt span:last-child{color:var(--brass-light); text-align:right;}
#mcc-app .mcc-install-card .mcc-btn-primary{margin-top:20px;}
@media (max-width:900px){#mcc-app .mcc-install{grid-template-columns:1fr;} #mcc-app .mcc-install-list{grid-template-columns:1fr;}}

/* calculator */
#mcc-app .mcc-calc-result .mcc-btn-primary{margin-top:20px; align-self:flex-start;}
@media (max-width:840px){#mcc-app .mcc-calc{padding:28px;}}

/* faq */
#mcc-app .mcc-faq{max-width:820px;}
#mcc-app .mcc-faq details{border-bottom:1px solid var(--line); padding:18px 0;}
#mcc-app .mcc-faq summary{cursor:pointer; font-family:'Amiri',serif; font-size:19px; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:16px;}
#mcc-app .mcc-faq summary::-webkit-details-marker{display:none;}
#mcc-app .mcc-faq summary::after{content:'+'; color:var(--brass); font-size:22px; line-height:1;}
#mcc-app .mcc-faq details[open] summary::after{content:'–';}
#mcc-app .mcc-faq details p{margin-top:10px; color:var(--text-dim); font-size:15px; max-width:68ch;}

/* closing cta */
#mcc-app .mcc-cta{background:var(--green-900); color:var(--plaster); border-radius:24px; padding:56px; display:grid; grid-template-columns:1.3fr .7fr; gap:32px; align-items:center; max-width:1180px; margin:0 auto 96px;}
#mcc-app .mcc-cta h2{font-size:clamp(26px,3vw,36px); color:var(--plaster);}
#mcc-app .mcc-cta p{color:#C9D2CB; margin-top:12px; max-width:50ch;}
#mcc-app .mcc-cta-actions{display:flex; flex-direction:column; gap:14px; align-items:flex-start;}
#mcc-app .mcc-cta .mcc-btn-ghost{color:var(--plaster);}
@media (max-width:1236px){#mcc-app .mcc-cta{margin-left:28px; margin-right:28px;}}
@media (max-width:900px){#mcc-app .mcc-cta{grid-template-columns:1fr; padding:34px 24px; margin-left:16px; margin-right:16px;}}

/* page hero + content pages */
#mcc-app .mcc-phero{padding:72px 0 40px;}
#mcc-app .mcc-phero h1{font-size:clamp(34px,4vw,50px); max-width:18ch;}
#mcc-app .mcc-phero p{margin-top:16px; max-width:58ch; color:var(--text-dim); font-size:17px;}
#mcc-app .mcc-two{display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start;}
@media (max-width:900px){#mcc-app .mcc-two{grid-template-columns:1fr;}}
#mcc-app .mcc-checklist{list-style:none; display:flex; flex-direction:column; gap:12px;}
#mcc-app .mcc-checklist li{display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:14.5px;}
#mcc-app .mcc-checklist li::before{content:'✓'; color:var(--green-700); font-weight:700;}
#mcc-app .mcc-prose h2{font-size:clamp(26px,3vw,34px);}
#mcc-app .mcc-prose p{color:var(--text-dim); font-size:16px; margin-top:14px; max-width:62ch;}
#mcc-app .mcc-values{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
#mcc-app .mcc-value{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px;}
#mcc-app .mcc-value h3{font-size:20px; margin-bottom:6px;}
#mcc-app .mcc-value p{font-size:14.5px; color:var(--text-dim);}
@media (max-width:900px){#mcc-app .mcc-values{grid-template-columns:1fr;}}
#mcc-app .mcc-rte{color:var(--text-dim); font-size:16px; max-width:68ch;}
#mcc-app .mcc-rte p{margin-top:12px;}

/* product page */
#mcc-app .mcc-crumbs{font-size:13px; color:var(--text-dim); padding-top:24px;}
#mcc-app .mcc-crumbs a{border-bottom:1px solid var(--line);}
#mcc-app .mcc-pdp{display:grid; grid-template-columns:1.05fr .95fr; gap:52px; padding:28px 0 80px; align-items:start;}
#mcc-app .mcc-gallery{position:sticky; top:110px;}
#mcc-app .mcc-gal-main{border-radius:20px; overflow:hidden; border:1px solid var(--line); background:var(--surface);}
#mcc-app .mcc-gal-main svg, #mcc-app .mcc-gal-main img{width:100%; display:block;}
#mcc-app .mcc-gal-thumbs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;}
#mcc-app .mcc-gal-thumbs img{border-radius:10px; border:1px solid var(--line); aspect-ratio:1; object-fit:cover; width:100%;}
#mcc-app .mcc-pdp h1{font-size:clamp(28px,3vw,40px);}
#mcc-app .mcc-pdp .mcc-sub{display:flex; gap:10px; margin-top:8px; color:var(--text-dim); font-size:14px; flex-wrap:wrap;}
#mcc-app .mcc-p-price{font-family:'Amiri',serif; font-size:30px; margin-top:18px;}
#mcc-app .mcc-p-price small{font-family:'Work Sans',sans-serif; font-size:13px; color:var(--text-dim); margin-left:8px;}
#mcc-app .mcc-opt-group{margin-top:26px; border:none;}
#mcc-app .mcc-opt-label{font-size:13px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; color:var(--text-dim); display:flex; justify-content:space-between; gap:12px; margin-bottom:10px;}
#mcc-app .mcc-opt-label span{text-transform:none; font-weight:400; letter-spacing:0;}
#mcc-app .mcc-chips{display:flex; gap:10px; flex-wrap:wrap;}
#mcc-app .mcc-chip input, #mcc-app .mcc-cdot input{position:absolute; opacity:0; pointer-events:none;}
#mcc-app .mcc-chip{position:relative; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 16px; font-size:14px; cursor:pointer; min-width:92px;}
#mcc-app .mcc-chip b{display:block; font-family:'Amiri',serif; font-size:18px;}
#mcc-app .mcc-chip small{color:var(--text-dim); font-size:12px;}
#mcc-app .mcc-chip:has(input:checked){border-color:var(--green-800); box-shadow:0 0 0 1px var(--green-800); background:#fff;}
#mcc-app .mcc-chip:has(input:disabled){opacity:.45; cursor:not-allowed;}
#mcc-app .mcc-chip:has(input:focus-visible), #mcc-app .mcc-cdot:has(input:focus-visible){outline:2px solid var(--brass); outline-offset:2px;}
#mcc-app .mcc-dots-row{display:flex; gap:10px; flex-wrap:wrap;}
#mcc-app .mcc-cdot{position:relative; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); cursor:pointer;}
#mcc-app .mcc-cdot:has(input:checked){box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--brass);}
#mcc-app .mcc-radio{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:14px 16px; cursor:pointer; margin-bottom:10px;}
#mcc-app .mcc-radio input{margin-top:5px; accent-color:var(--green-800);}
#mcc-app .mcc-radio strong{display:block; font-size:15px;}
#mcc-app .mcc-radio span{font-size:13px; color:var(--text-dim);}
#mcc-app .mcc-buy{display:flex; flex-direction:column; gap:12px; margin-top:26px;}
#mcc-app .mcc-buy .mcc-btn-primary{text-align:center; width:100%;}
#mcc-app .mcc-buy .mcc-btn-primary:disabled{opacity:.5; cursor:not-allowed;}
#mcc-app .mcc-assure{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin-top:22px; font-size:13.5px; color:var(--text-dim);}
#mcc-app .mcc-assure li::before{content:'✦ '; color:var(--brass);}
#mcc-app .mcc-acc{margin-top:30px; border-top:1px solid var(--line);}
#mcc-app .mcc-acc details{border-bottom:1px solid var(--line); padding:16px 0;}
#mcc-app .mcc-acc summary{cursor:pointer; font-weight:600; list-style:none; display:flex; justify-content:space-between;}
#mcc-app .mcc-acc summary::-webkit-details-marker{display:none;}
#mcc-app .mcc-acc summary::after{content:'+'; color:var(--brass);}
#mcc-app .mcc-acc details[open] summary::after{content:'–';}
#mcc-app .mcc-acc .mcc-body{margin-top:10px; font-size:14.5px; color:var(--text-dim);}
#mcc-app .mcc-acc .mcc-body p + p{margin-top:8px;}
#mcc-app .mcc-acc .mcc-body a{border-bottom:1px solid var(--brass);}
#mcc-app .mcc-spec{width:100%; border-collapse:collapse; font-size:14px;}
#mcc-app .mcc-spec td{padding:8px 0; border-bottom:1px dashed var(--line); vertical-align:top;}
#mcc-app .mcc-spec td:first-child{color:var(--text-dim); width:42%;}
#mcc-app .mcc-form-error{background:#fbeaea; color:#7a2020; border-radius:10px; padding:12px 14px; font-size:14px; margin-top:14px;}
@media (max-width:900px){#mcc-app .mcc-pdp{grid-template-columns:1fr;} #mcc-app .mcc-gallery{position:static;} #mcc-app .mcc-assure{grid-template-columns:1fr;}}

/* quote form */
#mcc-app .mcc-quote-grid{display:grid; grid-template-columns:1.4fr .6fr; gap:28px; align-items:start; padding-bottom:96px;}
#mcc-app .mcc-form{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:36px; display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;}
#mcc-app .mcc-form .mcc-full{grid-column:1/-1;}
#mcc-app .mcc-form label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;}
#mcc-app .mcc-form input, #mcc-app .mcc-form select, #mcc-app .mcc-form textarea{width:100%; padding:12px 14px; font:inherit; font-size:15px; border:1px solid var(--line); background:var(--bg); border-radius:10px; color:var(--text);}
#mcc-app .mcc-form textarea{min-height:110px; resize:vertical;}
#mcc-app .mcc-form .mcc-fine{font-size:12.5px; color:var(--text-dim);}
#mcc-app .mcc-form-ok{background:#e7f2ea; color:#1d5a34; border-radius:12px; padding:16px 18px; font-size:15px;}
#mcc-app .mcc-side{background:var(--green-900); color:var(--plaster); border-radius:20px; padding:32px;}
#mcc-app .mcc-side h3{color:var(--brass-light); font-size:22px; margin-bottom:12px;}
#mcc-app .mcc-side ol{padding-left:20px; display:flex; flex-direction:column; gap:12px; color:#C9D2CB; font-size:14.5px;}
#mcc-app .mcc-side ol b{color:var(--plaster);}
#mcc-app .mcc-side .mcc-contact-line{margin-top:20px; color:#C9D2CB; font-size:14px;}
@media (max-width:900px){#mcc-app .mcc-form{grid-template-columns:1fr; padding:24px;} #mcc-app .mcc-quote-grid{grid-template-columns:1fr;}}
@media (max-width:560px){#mcc-app .mcc-wrap{padding:0 16px;} #mcc-app .mcc-section{padding-left:0; padding-right:0;}}

/* ==========================================================================
   Detail pass (v3): tokens, contrast, rhythm, navigation, CTAs, images, motion
   ========================================================================== */
#mcc-app{
  --brass-text:#7F5B1C;          /* gold for text on light backgrounds (5.3:1 on plaster) */
  --sage-text:#4F6B5A;           /* green-grey for small text (5.8:1 on surface) */
  --muted-on-dark:#9AA69F;       /* small text on green-900 (6.2:1) */
  --section-y:clamp(64px, 8vw, 104px);
  --gap:24px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  --shadow-1:0 1px 2px rgba(15,40,34,.06), 0 2px 8px -2px rgba(15,40,34,.08);
  --shadow-2:0 18px 40px -22px rgba(15,40,34,.38);
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  --header-offset:112px;
  font-size:16px;
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth;} }
#mcc-app [id]{scroll-margin-top:var(--header-offset);}

/* focus: always visible for keyboard users */
#mcc-app a:focus-visible, #mcc-app button:focus-visible, #mcc-app summary:focus-visible,
#mcc-app input:focus-visible, #mcc-app select:focus-visible, #mcc-app textarea:focus-visible{
  outline:3px solid var(--green-800); outline-offset:3px; border-radius:6px;
}
#mcc-app .mcc-saff-section a:focus-visible, #mcc-app .mcc-cta a:focus-visible, #mcc-app .mcc-install-card a:focus-visible,
#mcc-app .mcc-footer a:focus-visible, #mcc-app .mcc-side a:focus-visible{outline-color:var(--brass-light);}

/* contrast fixes: gold / sage used as TEXT on light backgrounds */
#mcc-app .mcc-hero-copy .mcc-kicker, #mcc-app .mcc-eyebrow, #mcc-app .mcc-size-card .mcc-dims,
#mcc-app .mcc-step-num, #mcc-app .mcc-faq summary::after, #mcc-app .mcc-acc summary::after{color:var(--brass-text);}
#mcc-app .mcc-size-card .mcc-rows, #mcc-app .mcc-dims-ar{color:var(--sage-text);}
#mcc-app .mcc-navlinks a:hover{color:var(--brass-text);}

/* type floor: nothing below 14px except uppercase micro-labels */
#mcc-app .mcc-trust-badge, #mcc-app .mcc-hero-mini-stats span, #mcc-app .mcc-strip-item,
#mcc-app .mcc-swatch span, #mcc-app .mcc-swatch .mcc-ar-name, #mcc-app .mcc-calc-form label,
#mcc-app .mcc-calc-result .mcc-label, #mcc-app .mcc-calc-result .mcc-note, #mcc-app .mcc-hero-card-tag,
#mcc-app .mcc-foot-bottom, #mcc-app .mcc-crumbs, #mcc-app .mcc-form label, #mcc-app .mcc-chip small,
#mcc-app .mcc-radio span, #mcc-app .mcc-step .mcc-when, #mcc-app .mcc-size-card .mcc-rows{font-size:14px;}
#mcc-app .mcc-dims-ar{font-size:15px; text-align:left;}
#mcc-app .mcc-price, #mcc-app .mcc-p-price, #mcc-app .mcc-dims, #mcc-app .mcc-num{font-variant-numeric:tabular-nums lining-nums;}

/* vertical rhythm: one section spacing value, set by token */
#mcc-app .mcc-section{padding:var(--section-y) 0;}
#mcc-app .mcc-section.mcc-tight-top{padding-top:calc(var(--section-y) * .4);}
#mcc-app .mcc-section.mcc-flush-top{padding-top:0;}
#mcc-app .mcc-saff-section{padding:var(--section-y) 0;}
#mcc-app .mcc-section-head{margin-bottom:clamp(32px, 4vw, 48px);}
#mcc-app .mcc-section-head p{max-width:56ch;}
#mcc-app .mcc-grid-by-size, #mcc-app .mcc-steps, #mcc-app .mcc-values, #mcc-app .mcc-install-list,
#mcc-app .mcc-colorways{gap:var(--gap);}
#mcc-app .mcc-size-card{padding:28px; gap:14px; border-radius:var(--radius-lg); box-shadow:var(--shadow-1);}
#mcc-app .mcc-size-card:hover{box-shadow:var(--shadow-2);}
#mcc-app .mcc-step, #mcc-app .mcc-value, #mcc-app .mcc-install-list li{padding:24px; border-radius:var(--radius-md);}
#mcc-app .mcc-testimonial{padding:var(--section-y) 28px;}

/* ---------- header &amp; navigation ---------- */
#mcc-app header{transition:box-shadow var(--dur) var(--ease);}
#mcc-app header.is-scrolled{box-shadow:0 8px 24px -16px rgba(15,40,34,.35);}
#mcc-app .mcc-nav{padding:14px 28px; gap:20px;}
#mcc-app .mcc-navlinks{gap:6px; margin-right:12px;}
#mcc-app .mcc-navlinks a, #mcc-app .mcc-mobile-nav a{position:relative; display:inline-flex; align-items:center; min-height:44px; padding:0 12px; border-radius:8px;}
#mcc-app .mcc-navlinks a[aria-current=&quot;page&quot;], #mcc-app .mcc-mobile-nav a[aria-current=&quot;page&quot;]{color:var(--text); font-weight:500;}
#mcc-app .mcc-navlinks a[aria-current=&quot;page&quot;]::after, #mcc-app .mcc-mobile-nav a[aria-current=&quot;page&quot;]::after{content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; border-radius:2px; background:var(--brass);}
#mcc-app .mcc-cart-btn{position:relative; min-height:44px; padding:0 16px;}
#mcc-app .mcc-cart-count{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--green-800); color:#fff; font-size:12px; font-weight:600;}
#mcc-app .mcc-cart-count[data-count=&quot;0&quot;]{background:var(--plaster-dim); color:var(--text-dim);}
#mcc-app .mcc-mobile-nav{justify-content:space-between; padding:0 8px; gap:0; font-size:15px;}
@media (max-width:840px){
  #mcc-app .mcc-navtools .mcc-btn-primary{display:inline-flex;}
  #mcc-app .mcc-navtools{margin-left:auto;}
}
@media (max-width:560px){
  #mcc-app{--header-offset:128px;}
  #mcc-app .mcc-logo{gap:10px; font-size:15px;}
  #mcc-app .mcc-logo-mark{width:30px; height:30px;}
  #mcc-app .mcc-navtools{gap:8px;}
  #mcc-app .mcc-navtools .mcc-btn-primary{padding:0 14px; min-height:40px; font-size:14px;}
  #mcc-app .mcc-cart-btn{padding:0 10px; border:none;}
  #mcc-app .mcc-cart-label{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
}
@media (max-width:380px){ #mcc-app .mcc-logo-stack > span:first-child > span{display:none;} }

/* ---------- buttons: one system ---------- */
#mcc-app .mcc-btn-primary, #mcc-app .mcc-btn-secondary{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 28px; border-radius:999px; font-size:15px; font-weight:600; line-height:1.2; text-align:center; transition:transform var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease), color var(--dur) var(--ease);}
#mcc-app .mcc-btn-primary:active, #mcc-app .mcc-btn-secondary:active{transform:translateY(0) scale(.98);}
#mcc-app .mcc-btn-sm{min-height:44px; padding:0 20px; font-size:14px;}
#mcc-app .mcc-btn-secondary{background:transparent; color:var(--green-800); border:1.5px solid var(--green-800); cursor:pointer;}
#mcc-app .mcc-btn-secondary:hover{background:var(--green-800); color:var(--plaster);}
#mcc-app .mcc-on-dark .mcc-btn-secondary{color:var(--plaster); border-color:rgba(243,238,226,.5);}
#mcc-app .mcc-on-dark .mcc-btn-secondary:hover{background:var(--plaster); color:var(--green-900);}
#mcc-app .mcc-btn-ghost{display:inline-flex; align-items:center; gap:6px; min-height:44px; border-bottom:none; padding:0; background:linear-gradient(var(--brass),var(--brass)) left calc(100% - 10px) / 100% 1px no-repeat; transition:background-size var(--dur) var(--ease);}
#mcc-app .mcc-btn-ghost::after{content:'→'; transition:transform var(--dur) var(--ease);}
#mcc-app .mcc-btn-ghost:hover::after{transform:translateX(3px);}
#mcc-app .mcc-btn-primary[aria-busy=&quot;true&quot;]{opacity:.7; pointer-events:none;}
#mcc-app .mcc-cta-note{font-size:14px; color:var(--text-dim); margin-top:10px;}
#mcc-app .mcc-on-dark .mcc-cta-note{color:var(--muted-on-dark);}

/* ---------- hero ---------- */

/* ---------- product gallery ---------- */
#mcc-app .mcc-gal-main{aspect-ratio:1/1; position:relative;}

#mcc-app .mcc-gal-caption{position:absolute; left:14px; top:14px; background:rgba(255,253,248,.92); color:var(--text-dim); font-size:13px; padding:6px 12px; border-radius:999px;}
#mcc-app .mcc-gal-thumbs{grid-template-columns:repeat(5,1fr);}
#mcc-app .mcc-thumb{padding:0; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; aspect-ratio:1; cursor:pointer; background:var(--surface);}
#mcc-app .mcc-thumb img{width:100%; height:100%; object-fit:cover; border:none; border-radius:0;}
#mcc-app .mcc-thumb[aria-current=&quot;true&quot;]{border-color:var(--green-800); box-shadow:0 0 0 1px var(--green-800);}
#mcc-app .mcc-pdp .mcc-dims-ar{margin-bottom:4px;}
#mcc-app .mcc-cdot{width:44px; height:44px;}
#mcc-app .mcc-chip{min-height:64px;}

/* ---------- forms ---------- */
#mcc-app .mcc-form input, #mcc-app .mcc-form select, #mcc-app .mcc-calc-form input, #mcc-app .mcc-calc-form select{min-height:48px; font-size:16px;}

#mcc-app .mcc-foot-grid a:hover{color:var(--plaster);}
#mcc-app .mcc-foot-grid h4{font-size:13px; letter-spacing:.6px; text-transform:uppercase;}

/* ---------- motion: reveal on scroll (content stays visible without JS) ---------- */

}

/* Sticky header: the header sits inside its own section wrapper, so stickiness has to be on
   the header group. The Bismillah bar (fixed 44px) scrolls away; the nav stays pinned. */
html body #header-group{position:sticky; top:-44px; z-index:40;}

/* Mobile: quote button moves from the crowded header to a bar pinned to the bottom of the screen,
   shown once the visitor scrolls past the hero. Hidden on product pages (own CTAs) and the quote page. */
#mcc-app .mcc-mobile-cta{display:none;}
@media (max-width:560px){

  #mcc-app .mcc-mobile-cta{display:block; position:fixed; left:0; right:0; bottom:0; z-index:60; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); transform:translateY(110%); transition:transform var(--dur) var(--ease);}
  #mcc-app .mcc-mobile-cta.is-visible{transform:none;}

}

/* Hall cards as buy panels: the whole card opens the product (stretched title link), and the
   buy box at the bottom makes it clear this is where you purchase. */
#mcc-app article.mcc-size-card{position:relative; cursor:pointer;}
#mcc-app .mcc-card-title-link{color:inherit;}
#mcc-app .mcc-card-title-link::after{content:''; position:absolute; inset:0; z-index:1; border-radius:inherit;}
#mcc-app .mcc-size-card .mcc-pop-tag{z-index:3;}
#mcc-app .mcc-buy-box{position:relative; z-index:2; margin:6px -28px -28px; padding:20px 28px 22px; background:var(--plaster-dim); border-top:1px solid var(--line); border-radius:0 0 var(--radius-lg) var(--radius-lg); display:flex; flex-direction:column; gap:10px; cursor:default;}
#mcc-app .mcc-size-card.mcc-pop .mcc-buy-box{background:color-mix(in srgb, var(--brass) 14%, var(--surface));}
#mcc-app .mcc-buy-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
#mcc-app .mcc-buy-label{font-size:12px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--green-700);}
#mcc-app .mcc-buy-box .mcc-price{font-size:18px; font-weight:600;}
#mcc-app .mcc-buy-btn{width:100%;}
#mcc-app .mcc-buy-note{font-size:14px; color:var(--text-dim); line-height:1.45;}
#mcc-app .mcc-buy-quote{align-self:flex-start; display:inline-flex; align-items:center; min-height:44px; margin:-8px 0 -10px; font-size:14px; font-weight:500; color:var(--green-700); text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:3px;}
#mcc-app .mcc-buy-quote:hover{color:var(--text);}
#mcc-app .mcc-size-card p{flex:0 0 auto;}
#mcc-app .mcc-incl{flex:1;}

/* Hall-size carousel (owner request): arrows, middle card in front, side cards behind at 30%, no motion blur.
   Without JavaScript the cards stay a normal grid. Only the script's is-ready class switches the layout on;
   don't depend on html.mcc-js here, the live Horizon layout doesn't keep it. */
#mcc-app .mcc-visually-hidden{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
#mcc-app .mcc-size-carousel{position:relative;}
#mcc-app .mcc-size-carousel.is-ready .mcc-grid-by-size{display:grid; grid-template-columns:1fr; justify-items:center; padding:18px 0 8px; overflow:visible;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card{
  grid-area:1 / 1; width:min(420px, 78vw); --x:0%; --s:1;
  transform:translateX(var(--x)) scale(var(--s)); opacity:.3; z-index:1;
  transition:transform .45s cubic-bezier(.22,.8,.24,1), opacity .45s ease, box-shadow .3s ease;
}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card:hover{transform:translateX(var(--x)) scale(var(--s));}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;prev&quot;]{--x:-50%; --s:.86; cursor:pointer;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;next&quot;]{--x:50%; --s:.86; cursor:pointer;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;]{--x:0%; --s:1; opacity:1; z-index:3; box-shadow:var(--shadow-2);}
#mcc-app .mcc-carousel-nav{position:absolute; top:50%; z-index:5; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; background:var(--surface); color:var(--green-900); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; cursor:pointer; box-shadow:0 8px 20px -8px rgba(0,0,0,.45); transition:background .2s ease, transform .2s ease;}
#mcc-app .mcc-carousel-nav[hidden]{display:none;}
#mcc-app .mcc-carousel-nav:hover{background:var(--brass-light);}
#mcc-app .mcc-carousel-nav:active{transform:translateY(-50%) scale(.94);}
#mcc-app .mcc-carousel-nav:focus-visible{outline:3px solid var(--brass); outline-offset:3px;}
#mcc-app .mcc-carousel-prev{left:0;}
#mcc-app .mcc-carousel-next{right:0;}
@media (max-width:700px){
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;prev&quot;]{--x:-30%; --s:.84;}
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;next&quot;]{--x:30%; --s:.84;}
  #mcc-app .mcc-carousel-nav{width:44px; height:44px; top:auto; bottom:6px; transform:none;}
  #mcc-app .mcc-carousel-nav:active{transform:scale(.94);}
  #mcc-app .mcc-carousel-prev{left:calc(50% - 56px);}
  #mcc-app .mcc-carousel-next{right:calc(50% - 56px);}
  #mcc-app .mcc-size-carousel.is-ready{padding-bottom:64px;}
}
/* Buy section pops out toward the viewer on the card in front */
#mcc-app .mcc-size-carousel.is-ready .mcc-buy-box{transform-origin:50% 0; transition:transform .35s ease, box-shadow .35s ease;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box{transform:translateY(-6px) scale(1.04); box-shadow:0 22px 40px -18px rgba(15,40,34,.55), 0 2px 0 var(--brass) inset; border-radius:var(--radius-lg);}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box.is-popping{animation:mcc-buy-pop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes mcc-buy-pop{
  0%{transform:translateY(0) scale(1); box-shadow:0 0 0 rgba(15,40,34,0);}
  100%{transform:translateY(-6px) scale(1.04); box-shadow:0 22px 40px -18px rgba(15,40,34,.55), 0 2px 0 var(--brass) inset;}
}
@media (prefers-reduced-motion:reduce){
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card,
  #mcc-app .mcc-size-carousel.is-ready .mcc-buy-box{transition:none;}
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box.is-popping{animation:none;}
}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;hidden&quot;]{opacity:0; pointer-events:none; --s:.7;}

#mcc-app .mcc-hero-skyline{opacity:1;}
#mcc-app .mcc-strip.mcc-trust-band{transform:none; margin:0; max-width:none; border-radius:0; background:var(--green-900);}

@media (max-width:900px){#mcc-app .mcc-how-install{grid-template-columns:1fr;}}
/* Footer: one link per line (links were running together) */
#mcc-app .mcc-foot-grid a{display:flex; width:fit-content;}

/* Header (owner request): Request a quote sits right after the logo; Installation, About and FAQ move right,
   beside the cart. Hall sizes / Colours links removed. */
#mcc-app .mcc-nav-quote{flex:0 0 auto;}

he pile and the saff lines looking sharp.</p></details></div>

<script>
  (function(){
    try{
      var root = document.querySelector('[data-size-carousel]');
      if(!root) return;
      var cards = Array.prototype.slice.call(root.querySelectorAll('[data-carousel-card]'));
      if(cards.length < 2) return;
      var prevBtn = root.querySelector('[data-carousel-prev]'), nextBtn = root.querySelector('[data-carousel-next]');
      var status = root.querySelector('[data-carousel-status]');
      var still = window.matchMedia &amp;&amp; window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var n = cards.length, active = Math.floor((n - 1) / 2), timer = null, on = false;

      function layout(){
        cards.forEach(function(card, i){
          var d = (i - active + n) % n;
          var pos = d === 0 ? 'active' : (d === 1 ? 'next' : (d === n - 1 ? 'prev' : 'hidden'));
          card.setAttribute('data-pos', pos);
          card.setAttribute('aria-label', (i + 1) + ' of ' + n);
          card.setAttribute('aria-hidden', pos === 'active' ? 'false' : 'true');
          card.querySelectorAll('a, button').forEach(function(el){
            if(pos === 'active'){ el.removeAttribute('tabindex'); } else { el.setAttribute('tabindex', '-1'); }
          });
        });
        var title = cards[active].querySelector('h3');
        if(status &amp;&amp; title){ status.textContent = 'Showing ' + title.textContent.trim() + ', ' + (active + 1) + ' of ' + n; }
      }

      function pop(){
        var box = cards[active].querySelector('.mcc-buy-box');
        if(!box || still) return;
        box.classList.remove('is-popping'); void box.offsetWidth; box.classList.add('is-popping');
      }

      function go(index){
        if(!on) return;
        var next = (index + n) % n;
        if(next === active) return;
        cards.forEach(function(c){ var b = c.querySelector('.mcc-buy-box'); if(b){ b.classList.remove('is-popping'); } });
        active = next;
        layout();
        clearTimeout(timer);
        timer = setTimeout(pop, still ? 0 : 260);
      }

      prevBtn.addEventListener('click', function(){ go(active - 1); });
      nextBtn.addEventListener('click', function(){ go(active + 1); });

      root.addEventListener('click', function(e){
        var card = e.target.closest('[data-carousel-card]');
        if(on &amp;&amp; card &amp;&amp; card.getAttribute('data-pos') !== 'active'){
          e.preventDefault(); e.stopPropagation();
          go(cards.indexOf(card));
        }
      }, true);

      root.addEventListener('keydown', function(e){
        if(!on) return;
        if(e.key === 'ArrowLeft'){ e.preventDefault(); go(active - 1); prevBtn.focus(); }
        if(e.key === 'ArrowRight'){ e.preventDefault(); go(active + 1); nextBtn.focus(); }
      });

      var x0 = null;
      root.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive: true });
      root.addEventListener('touchend', function(e){
        if(x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if(Math.abs(dx) > 40){ go(active + (dx < 0 ? 1 : -1)); }
      }, { passive: true });

      function enable(){
        on = true;
        prevBtn.hidden = false; nextBtn.hidden = false;
        root.setAttribute('role', 'region'); root.setAttribute('aria-roledescription', 'carousel');
        cards.forEach(function(c){ c.setAttribute('aria-roledescription', 'slide'); });
        root.classList.add('is-ready');
        layout();
        setTimeout(pop, 300);
      }
      function disable(){
        on = false;
        prevBtn.hidden = true; nextBtn.hidden = true;
        root.classList.remove('is-ready');
        root.removeAttribute('role'); root.removeAttribute('aria-roledescription');
        cards.forEach(function(c){
          ['data-pos', 'aria-hidden', 'aria-label', 'aria-roledescription'].forEach(function(a){ c.removeAttribute(a); });
          c.querySelectorAll('[tabindex=&quot;-1&quot;]').forEach(function(el){ el.removeAttribute('tabindex'); });
          var b = c.querySelector('.mcc-buy-box'); if(b){ b.classList.remove('is-popping'); }
        });
        if(status){ status.textContent = ''; }
      }
      enable();
    }catch(e){ console.error('Hall size carousel error', e); }
  })();
</script>

#mcc-app{
  --brass-text:#7F5B1C;          /* gold for text on light backgrounds (5.3:1 on plaster) */
  --sage-text:#4F6B5A;           /* green-grey for small text (5.8:1 on surface) */
  --muted-on-dark:#9AA69F;       /* small text on green-900 (6.2:1) */
  --section-y:clamp(64px, 8vw, 104px);
  --gap:24px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  --shadow-1:0 1px 2px rgba(15,40,34,.06), 0 2px 8px -2px rgba(15,40,34,.08);
  --shadow-2:0 18px 40px -22px rgba(15,40,34,.38);
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  --header-offset:112px;
  font-size:16px;
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth;} }
#mcc-app [id]{scroll-margin-top:var(--header-offset);}

/* focus: always visible for keyboard users */
#mcc-app a:focus-visible, #mcc-app button:focus-visible, #mcc-app summary:focus-visible,
#mcc-app input:focus-visible, #mcc-app select:focus-visible, #mcc-app textarea:focus-visible{
  outline:3px solid var(--green-800); outline-offset:3px; border-radius:6px;
}
#mcc-app .mcc-saff-section a:focus-visible, #mcc-app .mcc-cta a:focus-visible, #mcc-app .mcc-install-card a:focus-visible,
#mcc-app .mcc-footer a:focus-visible, #mcc-app .mcc-side a:focus-visible{outline-color:var(--brass-light);}

/* contrast fixes: gold / sage used as TEXT on light backgrounds */
#mcc-app .mcc-hero-copy .mcc-kicker, #mcc-app .mcc-eyebrow, #mcc-app .mcc-size-card .mcc-dims,
#mcc-app .mcc-step-num, #mcc-app .mcc-faq summary::after, #mcc-app .mcc-acc summary::after{color:var(--brass-text);}
#mcc-app .mcc-size-card .mcc-rows, #mcc-app .mcc-dims-ar{color:var(--sage-text);}
#mcc-app .mcc-navlinks a:hover{color:var(--brass-text);}

/* type floor: nothing below 14px except uppercase micro-labels */
#mcc-app .mcc-trust-badge, #mcc-app .mcc-hero-mini-stats span, #mcc-app .mcc-strip-item,
#mcc-app .mcc-swatch span, #mcc-app .mcc-swatch .mcc-ar-name, #mcc-app .mcc-calc-form label,
#mcc-app .mcc-calc-result .mcc-label, #mcc-app .mcc-calc-result .mcc-note, #mcc-app .mcc-hero-card-tag,
#mcc-app .mcc-foot-bottom, #mcc-app .mcc-crumbs, #mcc-app .mcc-form label, #mcc-app .mcc-chip small,
#mcc-app .mcc-radio span, #mcc-app .mcc-step .mcc-when, #mcc-app .mcc-size-card .mcc-rows{font-size:14px;}
#mcc-app .mcc-dims-ar{font-size:15px; text-align:left;}
#mcc-app .mcc-price, #mcc-app .mcc-p-price, #mcc-app .mcc-dims, #mcc-app .mcc-num{font-variant-numeric:tabular-nums lining-nums;}

/* vertical rhythm: one section spacing value, set by token */
#mcc-app .mcc-section{padding:var(--section-y) 0;}
#mcc-app .mcc-section.mcc-tight-top{padding-top:calc(var(--section-y) * .4);}
#mcc-app .mcc-section.mcc-flush-top{padding-top:0;}
#mcc-app .mcc-saff-section{padding:var(--section-y) 0;}
#mcc-app .mcc-section-head{margin-bottom:clamp(32px, 4vw, 48px);}
#mcc-app .mcc-section-head p{max-width:56ch;}
#mcc-app .mcc-grid-by-size, #mcc-app .mcc-steps, #mcc-app .mcc-values, #mcc-app .mcc-install-list,
#mcc-app .mcc-colorways{gap:var(--gap);}
#mcc-app .mcc-size-card{padding:28px; gap:14px; border-radius:var(--radius-lg); box-shadow:var(--shadow-1);}
#mcc-app .mcc-size-card:hover{box-shadow:var(--shadow-2);}
#mcc-app .mcc-step, #mcc-app .mcc-value, #mcc-app .mcc-install-list li{padding:24px; border-radius:var(--radius-md);}
#mcc-app .mcc-testimonial{padding:var(--section-y) 28px;}

/* ---------- header &amp; navigation ---------- */
#mcc-app header{transition:box-shadow var(--dur) var(--ease);}
#mcc-app header.is-scrolled{box-shadow:0 8px 24px -16px rgba(15,40,34,.35);}
#mcc-app .mcc-nav{padding:14px 28px; gap:20px;}
#mcc-app .mcc-navlinks{gap:6px; margin-right:12px;}
#mcc-app .mcc-navlinks a, #mcc-app .mcc-mobile-nav a{position:relative; display:inline-flex; align-items:center; min-height:44px; padding:0 12px; border-radius:8px;}
#mcc-app .mcc-navlinks a[aria-current=&quot;page&quot;], #mcc-app .mcc-mobile-nav a[aria-current=&quot;page&quot;]{color:var(--text); font-weight:500;}
#mcc-app .mcc-navlinks a[aria-current=&quot;page&quot;]::after, #mcc-app .mcc-mobile-nav a[aria-current=&quot;page&quot;]::after{content:''; position:absolute; left:12px; right:12px; bottom:6px; height:2px; border-radius:2px; background:var(--brass);}
#mcc-app .mcc-cart-btn{position:relative; min-height:44px; padding:0 16px;}
#mcc-app .mcc-cart-count{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--green-800); color:#fff; font-size:12px; font-weight:600;}
#mcc-app .mcc-cart-count[data-count=&quot;0&quot;]{background:var(--plaster-dim); color:var(--text-dim);}
#mcc-app .mcc-mobile-nav{justify-content:space-between; padding:0 8px; gap:0; font-size:15px;}
@media (max-width:840px){
  #mcc-app .mcc-navtools .mcc-btn-primary{display:inline-flex;}
  #mcc-app .mcc-navtools{margin-left:auto;}
}
@media (max-width:560px){
  #mcc-app{--header-offset:128px;}
  #mcc-app .mcc-logo{gap:10px; font-size:15px;}
  #mcc-app .mcc-logo-mark{width:30px; height:30px;}
  #mcc-app .mcc-navtools{gap:8px;}
  #mcc-app .mcc-navtools .mcc-btn-primary{padding:0 14px; min-height:40px; font-size:14px;}
  #mcc-app .mcc-cart-btn{padding:0 10px; border:none;}
  #mcc-app .mcc-cart-label{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
}
@media (max-width:380px){ #mcc-app .mcc-logo-stack > span:first-child > span{display:none;} }

/* ---------- buttons: one system ---------- */
#mcc-app .mcc-btn-primary, #mcc-app .mcc-btn-secondary{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 28px; border-radius:999px; font-size:15px; font-weight:600; line-height:1.2; text-align:center; transition:transform var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease), color var(--dur) var(--ease);}
#mcc-app .mcc-btn-primary:active, #mcc-app .mcc-btn-secondary:active{transform:translateY(0) scale(.98);}
#mcc-app .mcc-btn-sm{min-height:44px; padding:0 20px; font-size:14px;}
#mcc-app .mcc-btn-secondary{background:transparent; color:var(--green-800); border:1.5px solid var(--green-800); cursor:pointer;}
#mcc-app .mcc-btn-secondary:hover{background:var(--green-800); color:var(--plaster);}
#mcc-app .mcc-on-dark .mcc-btn-secondary{color:var(--plaster); border-color:rgba(243,238,226,.5);}
#mcc-app .mcc-on-dark .mcc-btn-secondary:hover{background:var(--plaster); color:var(--green-900);}
#mcc-app .mcc-btn-ghost{display:inline-flex; align-items:center; gap:6px; min-height:44px; border-bottom:none; padding:0; background:linear-gradient(var(--brass),var(--brass)) left calc(100% - 10px) / 100% 1px no-repeat; transition:background-size var(--dur) var(--ease);}
#mcc-app .mcc-btn-ghost::after{content:'→'; transition:transform var(--dur) var(--ease);}
#mcc-app .mcc-btn-ghost:hover::after{transform:translateX(3px);}
#mcc-app .mcc-btn-primary[aria-busy=&quot;true&quot;]{opacity:.7; pointer-events:none;}
#mcc-app .mcc-cta-note{font-size:14px; color:var(--text-dim); margin-top:10px;}
#mcc-app .mcc-on-dark .mcc-cta-note{color:var(--muted-on-dark);}

/* ---------- hero ---------- */
#mcc-app .mcc-hero-copy h1{max-width:16ch; font-size:clamp(36px, 4.6vw, 58px); line-height:1.08;}
#mcc-app .mcc-hero-copy p{max-width:48ch;}
#mcc-app .mcc-hero-mini-stats{gap:28px; flex-wrap:wrap;}
@media (max-width:600px){
  #mcc-app .mcc-hero-card{display:none;}
  #mcc-app .mcc-hero-inner{padding:0 16px 96px;}
  #mcc-app .mcc-hero-actions{gap:8px 20px;}
}
@media (max-width:700px){
  #mcc-app .mcc-strip{margin-left:16px; margin-right:16px; transform:translateY(-56px);}
  #mcc-app .mcc-strip .mcc-wrap{padding:8px 4px;}
  #mcc-app .mcc-strip-item{border-right:none; border-bottom:1px solid var(--line); padding:14px 18px;}
  #mcc-app .mcc-strip-item:last-child{border-bottom:none;}
}

/* ---------- hall cards: image slot keeps every card the same shape ---------- */
#mcc-app .mcc-card-media{margin:-28px -28px 4px; aspect-ratio:16/9; overflow:hidden; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--green-900);}
#mcc-app .mcc-card-media img, #mcc-app .mcc-card-media svg{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease);}
#mcc-app .mcc-size-card:hover .mcc-card-media img, #mcc-app .mcc-size-card:hover .mcc-card-media svg{transform:scale(1.04);}
#mcc-app .mcc-size-card .mcc-pop-tag{z-index:2;}
#mcc-app .mcc-size-foot{flex-direction:row; justify-content:space-between; align-items:flex-end; gap:12px;}
#mcc-app .mcc-card-link{font-size:14px; font-weight:600; color:var(--green-700); white-space:nowrap;}
#mcc-app .mcc-card-link::after{content:' →'; display:inline-block; transition:transform var(--dur) var(--ease);}
#mcc-app .mcc-size-card:hover .mcc-card-link::after{transform:translateX(3px);}

/* ---------- colourways ---------- */
#mcc-app .mcc-swatch .mcc-block{aspect-ratio:4/3;}
#mcc-app .mcc-swatch p{font-size:15px;}
#mcc-app .mcc-swatch:focus-visible{outline:3px solid var(--green-800); outline-offset:4px; border-radius:var(--radius-md);}

/* ---------- product gallery ---------- */
#mcc-app .mcc-gal-main{aspect-ratio:1/1; position:relative;}
#mcc-app .mcc-gal-main img, #mcc-app .mcc-gal-main svg{width:100%; height:100%; object-fit:cover;}
#mcc-app .mcc-gal-main img{transition:transform .5s var(--ease);}
@media (hover:hover){ #mcc-app .mcc-gal-main:hover img{transform:scale(1.04);} }
#mcc-app .mcc-gal-caption{position:absolute; left:14px; top:14px; background:rgba(255,253,248,.92); color:var(--text-dim); font-size:13px; padding:6px 12px; border-radius:999px;}
#mcc-app .mcc-gal-thumbs{grid-template-columns:repeat(5,1fr);}
#mcc-app .mcc-thumb{padding:0; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; aspect-ratio:1; cursor:pointer; background:var(--surface);}
#mcc-app .mcc-thumb img{width:100%; height:100%; object-fit:cover; border:none; border-radius:0;}
#mcc-app .mcc-thumb[aria-current=&quot;true&quot;]{border-color:var(--green-800); box-shadow:0 0 0 1px var(--green-800);}
#mcc-app .mcc-pdp .mcc-dims-ar{margin-bottom:4px;}
#mcc-app .mcc-cdot{width:44px; height:44px;}
#mcc-app .mcc-chip{min-height:64px;}

/* ---------- forms ---------- */
#mcc-app .mcc-form input, #mcc-app .mcc-form select, #mcc-app .mcc-calc-form input, #mcc-app .mcc-calc-form select{min-height:48px; font-size:16px;}
#mcc-app .mcc-req{color:#8E2B2B; margin-left:2px;}
#mcc-app .mcc-form input:user-invalid{border-color:#8E2B2B;}
#mcc-app .mcc-form-ok:focus{outline:none;}

/* ---------- footer ---------- */
#mcc-app .mcc-footer{background:var(--green-900); color:#C9D2CB; padding:64px 0 32px;}
#mcc-app .mcc-foot-grid a{display:inline-flex; align-items:center; min-height:36px; margin-bottom:2px;}
#mcc-app .mcc-foot-grid a:hover{color:var(--plaster);}
#mcc-app .mcc-foot-grid h4{font-size:13px; letter-spacing:.6px; text-transform:uppercase;}
#mcc-app .mcc-foot-bottom{color:var(--muted-on-dark);}

/* ---------- motion: reveal on scroll (content stays visible without JS) ---------- */
@media (prefers-reduced-motion:no-preference){
  html.mcc-js #mcc-app [data-reveal]{opacity:0; transform:translateY(14px); transition:opacity .6s var(--ease), transform .6s var(--ease);}
  html.mcc-js #mcc-app [data-reveal].is-in{opacity:1; transform:none;}
}

/* Sticky header: the header sits inside its own section wrapper, so stickiness has to be on
   the header group. The Bismillah bar (fixed 44px) scrolls away; the nav stays pinned. */
html body #header-group{position:sticky; top:-44px; z-index:40;}
#mcc-app .mcc-bismillah-bar{height:44px; padding:0 12px; display:flex; align-items:center; justify-content:center; line-height:1;}
#mcc-app header{position:relative; top:auto;}
@media print{ html.mcc-js #mcc-app [data-reveal]{opacity:1; transform:none;} }

/* Mobile: quote button moves from the crowded header to a bar pinned to the bottom of the screen,
   shown once the visitor scrolls past the hero. Hidden on product pages (own CTAs) and the quote page. */
#mcc-app .mcc-mobile-cta{display:none;}
@media (max-width:560px){
  #mcc-app .mcc-navtools .mcc-btn-primary{display:none;}
  #mcc-app .mcc-mobile-cta{display:block; position:fixed; left:0; right:0; bottom:0; z-index:60; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); transform:translateY(110%); transition:transform var(--dur) var(--ease);}
  #mcc-app .mcc-mobile-cta.is-visible{transform:none;}
  #mcc-app .mcc-mobile-cta .mcc-btn-primary{width:100%;}
  html body:has(.mcc-mobile-cta){padding-bottom:76px;}
}
#mcc-app .mcc-size-card .mcc-rows{margin-top:-4px;}

/* Hall cards as buy panels: the whole card opens the product (stretched title link), and the
   buy box at the bottom makes it clear this is where you purchase. */
#mcc-app article.mcc-size-card{position:relative; cursor:pointer;}
#mcc-app .mcc-card-title-link{color:inherit;}
#mcc-app .mcc-card-title-link::after{content:''; position:absolute; inset:0; z-index:1; border-radius:inherit;}
#mcc-app .mcc-size-card .mcc-pop-tag{z-index:3;}
#mcc-app .mcc-buy-box{position:relative; z-index:2; margin:6px -28px -28px; padding:20px 28px 22px; background:var(--plaster-dim); border-top:1px solid var(--line); border-radius:0 0 var(--radius-lg) var(--radius-lg); display:flex; flex-direction:column; gap:10px; cursor:default;}
#mcc-app .mcc-size-card.mcc-pop .mcc-buy-box{background:color-mix(in srgb, var(--brass) 14%, var(--surface));}
#mcc-app .mcc-buy-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
#mcc-app .mcc-buy-label{font-size:12px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--green-700);}
#mcc-app .mcc-buy-box .mcc-price{font-size:18px; font-weight:600;}
#mcc-app .mcc-buy-btn{width:100%;}
#mcc-app .mcc-buy-note{font-size:14px; color:var(--text-dim); line-height:1.45;}
#mcc-app .mcc-buy-quote{align-self:flex-start; display:inline-flex; align-items:center; min-height:44px; margin:-8px 0 -10px; font-size:14px; font-weight:500; color:var(--green-700); text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:3px;}
#mcc-app .mcc-buy-quote:hover{color:var(--text);}
#mcc-app .mcc-size-card p{flex:0 0 auto;}
#mcc-app .mcc-incl{flex:1;}

/* Hall-size carousel (owner request): arrows, middle card in front, side cards behind at 30%, no motion blur.
   Without JavaScript the cards stay a normal grid. Only the script's is-ready class switches the layout on;
   don't depend on html.mcc-js here, the live Horizon layout doesn't keep it. */
#mcc-app .mcc-visually-hidden{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
#mcc-app .mcc-size-carousel{position:relative;}
#mcc-app .mcc-size-carousel.is-ready .mcc-grid-by-size{display:grid; grid-template-columns:1fr; justify-items:center; padding:18px 0 8px; overflow:visible;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card{
  grid-area:1 / 1; width:min(420px, 78vw); --x:0%; --s:1;
  transform:translateX(var(--x)) scale(var(--s)); opacity:.3; z-index:1;
  transition:transform .45s cubic-bezier(.22,.8,.24,1), opacity .45s ease, box-shadow .3s ease;
}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card:hover{transform:translateX(var(--x)) scale(var(--s));}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;prev&quot;]{--x:-50%; --s:.86; cursor:pointer;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;next&quot;]{--x:50%; --s:.86; cursor:pointer;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;]{--x:0%; --s:1; opacity:1; z-index:3; box-shadow:var(--shadow-2);}
#mcc-app .mcc-carousel-nav{position:absolute; top:50%; z-index:5; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; background:var(--surface); color:var(--green-900); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; cursor:pointer; box-shadow:0 8px 20px -8px rgba(0,0,0,.45); transition:background .2s ease, transform .2s ease;}
#mcc-app .mcc-carousel-nav[hidden]{display:none;}
#mcc-app .mcc-carousel-nav:hover{background:var(--brass-light);}
#mcc-app .mcc-carousel-nav:active{transform:translateY(-50%) scale(.94);}
#mcc-app .mcc-carousel-nav:focus-visible{outline:3px solid var(--brass); outline-offset:3px;}
#mcc-app .mcc-carousel-prev{left:0;}
#mcc-app .mcc-carousel-next{right:0;}
@media (max-width:700px){
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;prev&quot;]{--x:-30%; --s:.84;}
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;next&quot;]{--x:30%; --s:.84;}
  #mcc-app .mcc-carousel-nav{width:44px; height:44px; top:auto; bottom:6px; transform:none;}
  #mcc-app .mcc-carousel-nav:active{transform:scale(.94);}
  #mcc-app .mcc-carousel-prev{left:calc(50% - 56px);}
  #mcc-app .mcc-carousel-next{right:calc(50% - 56px);}
  #mcc-app .mcc-size-carousel.is-ready{padding-bottom:64px;}
}
/* Buy section pops out toward the viewer on the card in front */
#mcc-app .mcc-size-carousel.is-ready .mcc-buy-box{transform-origin:50% 0; transition:transform .35s ease, box-shadow .35s ease;}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box{transform:translateY(-6px) scale(1.04); box-shadow:0 22px 40px -18px rgba(15,40,34,.55), 0 2px 0 var(--brass) inset; border-radius:var(--radius-lg);}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box.is-popping{animation:mcc-buy-pop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes mcc-buy-pop{
  0%{transform:translateY(0) scale(1); box-shadow:0 0 0 rgba(15,40,34,0);}
  100%{transform:translateY(-6px) scale(1.04); box-shadow:0 22px 40px -18px rgba(15,40,34,.55), 0 2px 0 var(--brass) inset;}
}
@media (prefers-reduced-motion:reduce){
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card,
  #mcc-app .mcc-size-carousel.is-ready .mcc-buy-box{transition:none;}
  #mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;active&quot;] .mcc-buy-box.is-popping{animation:none;}
}
#mcc-app .mcc-size-carousel.is-ready .mcc-size-card[data-pos=&quot;hidden&quot;]{opacity:0; pointer-events:none; --s:.7;}

/* Layout pass (owner-approved suggestions): buying first, fewer sections, alternating bands. */
/* Trust points: a green band the hero skyline rises out of (fixes the clipped domes) */
#mcc-app .mcc-hero-skyline{opacity:1;}
#mcc-app .mcc-strip.mcc-trust-band{transform:none; margin:0; max-width:none; border-radius:0; background:var(--green-900);}
#mcc-app .mcc-trust-band .mcc-wrap{max-width:1180px; margin:0 auto; padding:6px 28px 30px;}
#mcc-app .mcc-trust-band .mcc-strip-item{color:var(--muted-on-dark); border-color:rgba(243,238,226,.14);}
#mcc-app .mcc-trust-band .mcc-strip-item strong{color:var(--plaster);}
@media (max-width:640px){
  #mcc-app .mcc-strip.mcc-trust-band{margin:0; transform:none;}
  #mcc-app .mcc-trust-band .mcc-wrap{padding:4px 16px 20px;}
}
/* Alternating light band */
#mcc-app .mcc-band{background:var(--plaster-dim);}
#mcc-app .mcc-band .mcc-calc{background:var(--surface);}
/* Spacing tip + calculator link under the hall-size slider */
#mcc-app .mcc-size-help{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:14px 28px; margin-top:clamp(28px,4vw,44px); padding:18px 22px; border-top:1px solid var(--brass); border-bottom:1px solid var(--line);}
#mcc-app .mcc-size-help-tip{display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline; font-size:14.5px; color:var(--text-dim);}
#mcc-app .mcc-size-help-tip strong{color:var(--text); font-size:15px;}
#mcc-app .mcc-size-help-tip b{color:var(--brass-text); font-weight:600;}
/* How it works: one dark band (steps + installation) */
#mcc-app .mcc-how{background:var(--green-900); color:var(--plaster);}
#mcc-app .mcc-how .mcc-section-head h2{color:var(--plaster);}
#mcc-app .mcc-how .mcc-section-head p{color:var(--muted-on-dark);}
#mcc-app .mcc-how .mcc-eyebrow{color:var(--brass-light);}
#mcc-app .mcc-how .mcc-step{background:rgba(243,238,226,.04); border-color:rgba(243,238,226,.14);}
#mcc-app .mcc-how .mcc-step-num{color:var(--brass-light);}
#mcc-app .mcc-how .mcc-step h3{color:var(--plaster);}
#mcc-app .mcc-how .mcc-step p{color:var(--muted-on-dark);}
#mcc-app .mcc-how .mcc-step .mcc-when{color:var(--plaster); background:rgba(215,174,92,.16);}
#mcc-app .mcc-how-install{display:grid; grid-template-columns:1.1fr .9fr; gap:clamp(28px,4vw,48px); align-items:start; margin-top:clamp(40px,5vw,64px); padding-top:clamp(32px,4vw,48px); border-top:1px solid rgba(215,174,92,.35);}
#mcc-app .mcc-how-sub{font-size:clamp(22px,2.4vw,28px); color:var(--plaster); margin-bottom:20px;}
#mcc-app .mcc-how .mcc-install-list li{background:rgba(243,238,226,.04); border-color:rgba(243,238,226,.14);}
#mcc-app .mcc-how .mcc-install-list strong{color:var(--plaster);}
#mcc-app .mcc-how .mcc-install-list span{color:var(--muted-on-dark);}
#mcc-app .mcc-how .mcc-install-card{background:var(--green-800); border:1px solid rgba(215,174,92,.45);}
@media (max-width:900px){#mcc-app .mcc-how-install{grid-template-columns:1fr;}}
/* Footer: one link per line (links were running together) */
#mcc-app .mcc-foot-grid a{display:flex; width:fit-content;}

/* Header (owner request): Request a quote sits right after the logo; Installation, About and FAQ move right,
   beside the cart. Hall sizes / Colours links removed. */
#mcc-app .mcc-nav-quote{flex:0 0 auto;}
#mcc-app .mcc-navlinks{margin-left:auto; margin-right:4px;}
@media (max-width:840px){ #mcc-app .mcc-navtools{margin-left:auto;} }
@media (max-width:560px){ #mcc-app .mcc-nav-quote{display:none;} }

/* Marketing review pass */
#mcc-app .mcc-size-area{font-size:14px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
#mcc-app .mcc-buy-box-quote .mcc-buy-label{color:var(--brass-text);}
/* WhatsApp chat button (only rendered when a number is set in the header settings) */
#mcc-app .mcc-whatsapp{position:fixed; right:16px; bottom:16px; z-index:61; display:inline-flex; align-items:center; gap:8px; min-height:52px; padding:0 18px 0 14px; border-radius:999px; background:#1F7A4D; color:#fff; font-weight:600; font-size:15px; box-shadow:0 10px 24px -10px rgba(0,0,0,.45);}
#mcc-app .mcc-whatsapp:hover{background:#186640;}
#mcc-app .mcc-whatsapp:focus-visible{outline:3px solid var(--brass); outline-offset:3px;}
@media (max-width:560px){#mcc-app .mcc-whatsapp{bottom:84px; padding:0 14px;} #mcc-app .mcc-whatsapp span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}}

/* 3D roll on the product page (loads on request) */
#mcc-app .mcc-3d-stage{position:absolute; inset:0; background:var(--plaster-dim); touch-action:none; outline:none;}
#mcc-app .mcc-3d-stage:focus-visible{box-shadow:inset 0 0 0 3px var(--brass);}
#mcc-app .mcc-3d-stage canvas{display:block; width:100%; height:100%;}
#mcc-app .mcc-3d-msg{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--text-dim); margin:0;}
#mcc-app .mcc-3d-bar{display:grid; gap:10px; margin-top:14px;}
#mcc-app .mcc-3d-controls{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center;}
#mcc-app .mcc-3d-controls input[type=range]{width:100%; min-height:44px; accent-color:var(--brass);}
#mcc-app .mcc-3d-controls .mcc-btn-secondary{padding:0 20px;}
#mcc-app .mcc-3d-note{font-size:14px; color:var(--text-dim); margin:0;}
#mcc-app .mcc-3d-bar[hidden], #mcc-app .mcc-3d-bar [hidden], #mcc-app .mcc-3d-stage [hidden]{display:none;}
#mcc-app .mcc-3d-controls .mcc-btn-ghost{border:0; background-color:transparent; color:var(--text); font:inherit; font-size:15px; cursor:pointer;}
#mcc-app .mcc-swatch .mcc-block[style*=&quot;url(&quot;]::after{display:none;} /* woven pattern swatches need no stripe overlay */

<script>
  (function(){
    try{
      var root = document.documentElement;
      root.classList.add('mcc-js');
      var header = document.querySelector('#mcc-app header');
      var bar = document.getElementById('mccMobileCta');
      function onScroll(){
        if(header){ header.classList.toggle('is-scrolled', window.scrollY > 8); }
        if(bar){ bar.classList.toggle('is-visible', window.scrollY > 480); }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      function reveal(){
        var items = document.querySelectorAll('#mcc-app [data-reveal]');
        if(!('IntersectionObserver' in window)){ items.forEach(function(el){ el.classList.add('is-in'); }); return; }
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); } });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
        items.forEach(function(el){ io.observe(el); });
      }
      if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', reveal); } else { reveal(); }
    }catch(e){ document.documentElement.classList.remove('mcc-js'); console.error('Header script error', e); }
  })();
</script>

<script>
(function(){
  try{
    var form = document.getElementById('mcc-product-form');
    if(!form) return;
    var price = document.getElementById('mccPrice'), cwName = document.getElementById('mccCwName');
    var carpet = document.getElementById('mccArtCarpet'), lines = document.getElementById('mccArtLines'), cap = document.getElementById('mccArtCap');
    var coverage = &quot;Approx. 8 × 12 m (96 m²)&quot;;
    function sel(name){ return form.querySelector('input[name=&quot;' + name + '&quot;]:checked'); }
    function update(){
      var v = sel('id'), c = sel('properties[Colourway]');
      if(v &amp;&amp; v.dataset.price){ price.textContent = v.dataset.price; }
      if(c){ cwName.textContent = c.value; }
      if(carpet &amp;&amp; lines){
        var spacing = v &amp;&amp; v.dataset.spacing ? parseFloat(v.dataset.spacing) : 95, step = spacing / 100 * 33, s = '';
        for(var y = step; y < 420; y += step){ s += '<line x1=&quot;0&quot; y1=&quot;' + y.toFixed(1) + '&quot; x2=&quot;480&quot; y2=&quot;' + y.toFixed(1) + '&quot;/>'; }
        lines.innerHTML = s;
        if(c){ carpet.setAttribute('fill', c.dataset.colour); }
        cap.textContent = 'Illustration · ' + (coverage ? coverage.replace('Approx. ', '').replace(/ \(.*\)/, '') + ' · ' : '') + spacing + 'cm spacing · ' + (c ? c.value : '');
      }
    }
    form.addEventListener('change', update);
    update();

    // 3D roll: nothing loads until the buyer asks for it, so the page stays as fast as before.
    var bar = document.getElementById('mcc3dBar'), stage = document.getElementById('mcc3dStage'), open = document.getElementById('mcc3dOpen');
    var controls = document.getElementById('mcc3dControls'), note = document.getElementById('mcc3dNote'), msg = document.getElementById('mcc3dMsg');
    var rollBtn = document.getElementById('mcc3dRoll'), frac = document.getElementById('mcc3dFrac'), viewer = null;
    function webgl(){ try{ var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext &amp;&amp; (c.getContext('webgl') || c.getContext('experimental-webgl'))); }catch(e){ return false; } }
    function load(src){ return new Promise(function(ok, fail){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
    function spacing(){ var v = sel('id'); return v &amp;&amp; v.dataset.spacing ? parseFloat(v.dataset.spacing) / 100 : 0.95; }
    function show3d(on){
      stage.hidden = !on; controls.hidden = !on; note.hidden = !on; open.hidden = on;
      open.setAttribute('aria-expanded', on ? 'true' : 'false');
    }
    if(bar &amp;&amp; webgl()){
      bar.hidden = false;
      open.addEventListener('click', function(){
        show3d(true); msg.hidden = false; msg.textContent = 'Loading the 3D roll…';
        var ready = window.THREE ? Promise.resolve() : load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
        ready.then(function(){ return window.MCCRoll3D ? null : load(bar.dataset.script); }).then(function(){
          if(viewer || stage.hidden) return;
          var c = sel('properties[Colourway]');
          viewer = MCCRoll3D.mount(stage, { texture: c.dataset.pattern, aspect: parseFloat(c.dataset.aspect), spacing: spacing(), length: 10,
            onChange: function(f){ frac.value = Math.round(f * 1000); rollBtn.textContent = f < 0.98 ? 'Unroll' : 'Roll up'; } });
          msg.hidden = true; document.getElementById('mcc3dWidth').textContent = Math.round(spacing() * 100); stage.focus();
        }).catch(function(){ msg.textContent = 'The 3D roll could not load. Check your connection and try again.'; });
      });
      document.getElementById('mcc3dClose').addEventListener('click', function(){ if(viewer){ viewer.destroy(); viewer = null; } show3d(false); open.focus(); });
      rollBtn.addEventListener('click', function(){ if(viewer) viewer.toggle(); });
      frac.addEventListener('input', function(){ if(viewer) viewer.setFraction(frac.value / 1000); });
      form.addEventListener('change', function(e){
        if(!viewer) return;
        if(e.target.name === 'properties[Colourway]') viewer.setPattern(e.target.dataset.pattern, parseFloat(e.target.dataset.aspect));
        if(e.target.name === 'id'){ viewer.setSpacing(spacing()); document.getElementById('mcc3dWidth').textContent = Math.round(spacing() * 100); }
      });
    }
    form.addEventListener('submit', function(){
      var btn = form.querySelector('button[type=&quot;submit&quot;]');
      if(btn){ btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Adding…'; }
    });
    var main = document.getElementById('mccMainImg');
    document.querySelectorAll('.mcc-thumb').forEach(function(t){
      t.addEventListener('click', function(){
        if(!main) return;
        main.removeAttribute('srcset');
        main.src = t.dataset.src; main.alt = t.dataset.alt;
        document.querySelectorAll('.mcc-thumb').forEach(function(x){ x.setAttribute('aria-current', x === t ? 'true' : 'false'); });
      });
    });
  }catch(e){ console.error('Product page error', e); }
})();
</script>
